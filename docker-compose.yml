services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: /
    ports:
      - "8085:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ../Finance_Control_Api
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      APPLY_MIGRATIONS: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=FinanceControlApi;User Id=${SQL_USER:-finance};Password=${SQL_PASSWORD};TrustServerCertificate=True
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      OpenTelemetry__Enabled: "false"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  hangfire:
    build:
      context: ../Finance_Control_Api
      dockerfile: Dockerfile
      target: hangfire
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=FinanceControlApi;User Id=${SQL_USER:-finance};Password=${SQL_PASSWORD};TrustServerCertificate=True
      RabbitMq__Host: rabbitmq
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - finance-control-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - finance-control-rabbit:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  finance-control-sql:
  finance-control-rabbit:
