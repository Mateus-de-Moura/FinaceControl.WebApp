trigger:
- main  

pool:
  name: default 

variables:
  nodeVersion: '18.x'
  buildDir: 'dist'  # ou 'dist' se usar Vite
  destinationPath: 'C:\Users\Mateus\Desktop\PublishWeb' 

steps:
- task: NodeTool@0
  displayName: 'Instalar Node.js'
  inputs:
    versionSpec: '$(nodeVersion)'
    checkLatest: true

- script: |
    npm install
  displayName: 'Instalar dependências'

- script: |
    npm run build
  displayName: 'Executar build do React'

- powershell: |
    $webConfigPath = "$(System.DefaultWorkingDirectory)\$(buildDir)\web.config"
    $webConfigLines = @(
      '<?xml version="1.0"?>'
      '<configuration>'
      '  <system.webServer>'
      '    <rewrite>'
      '      <rules>'
      '        <rule name="React Routes" stopProcessing="true">'
      '          <match url=".*" />'
      '          <conditions logicalGrouping="MatchAll">'
      '            <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />'
      '            <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />'
      '            <add input="{REQUEST_URI}" pattern="^/(api)" negate="true" />'
      '          </conditions>'
      '          <action type="Rewrite" url="/" />'
      '        </rule>'
      '      </rules>'
      '    </rewrite>'
      '  </system.webServer>'
      '</configuration>'
    )
    $webConfigContent = $webConfigLines -join "`r`n"
    Set-Content -Path $webConfigPath -Value $webConfigContent -Encoding UTF8
  displayName: 'Criar web.config corrigido'

- powershell: |
    $source = "$(System.DefaultWorkingDirectory)\$(buildDir)"
    $destination = "$(destinationPath)"

    if (!(Test-Path -Path $destination)) {
      New-Item -ItemType Directory -Path $destination | Out-Null
    }

    Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force

    Write-Host "Build do React copiado com sucesso para: $destination"
  displayName: 'Copiar build para IIS'
